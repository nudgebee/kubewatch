---
# Default ClusterRole for kubewatch. Resources here match the watch flags
# exposed by `kubewatch resource add` (svc, deploy, po, ns, ds, statefulset,
# ingress, sa, clusterrole, clusterrolebinding, coreevent, rollout, …).
#
# `secrets` is intentionally omitted. Cluster-wide read on secrets is a high
# privilege; enable it explicitly only if you set `--secret` and have audited
# what your configured handler publishes downstream.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: kubewatch
rules:
- apiGroups: [""]
  resources:
  - configmaps
  - events
  - namespaces
  - nodes
  - persistentvolumes
  - pods
  - replicationcontrollers
  - serviceaccounts
  - services
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources:
  - daemonsets
  - deployments
  - replicasets
  - statefulsets
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources:
  - jobs
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources:
  - clusterroles
  - clusterrolebindings
  verbs: ["get", "list", "watch"]
- apiGroups: ["argoproj.io"]
  resources:
  - rollouts
  verbs: ["get", "list", "watch"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubewatch
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubewatch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubewatch
subjects:
  - kind: ServiceAccount
    name: kubewatch
    namespace: default
